<!DOCTYPE html>
<html>
<head>
  <title>Wind Arrows Colored by Speed</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .info.legend {
      background: white;
      padding: 10px;
      line-height: 1.4;
      font: 14px/1.5 "Helvetica Neue", Arial, Helvetica, sans-serif;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 5px;
    }
    .info.legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.8;
      background: #ccc;
    }
    .arrow-icon {
      background: none;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>

    /// wind file
    const wind_file = "../Outputs/path_rich_rad3_0kW_properties_small.geojson";
    /// path file
    const path_file = '../Outputs/path_rich_rad3_0kW_small.geojson';
    // /// great circle path file
    const great_circle_path = "../Outputs/great_circle_path.geojson";


    // Speed to color mapping
    function getColor(speed) {
      return speed > 15 ? '#d73027' :
             speed > 10 ? '#fc8d59' :
             speed > 5  ? '#fee08b' :
             speed > 2  ? '#91cf60' :
                          '#4575b4';
    }

    // Initialize map
    const map = L.map('map').setView([35, -40], 3.5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
      attribution: '© OpenSeaMap contributors',
      opacity: 0.7
    }).addTo(map);

    const arrowLayerGroup = L.layerGroup().addTo(map);

      fetch(wind_file)
        .then(response => response.json())
        .then(data => {
          arrowLayerGroup.clearLayers();

          const scale = 0.1;
          const path = [];

          data.features.forEach(feature => {
            const [lon, lat] = feature.geometry.coordinates;
            path.push([lat, lon]); // Use [lat, lon] for map coords

            const u = feature.properties.u_component;
            const v = feature.properties.v_component;
            const speed = feature.properties.wind_speed;
            const color = getColor(speed);

            const endLat = lat + v * scale;
            const endLon = lon + u * scale;


            // Wind arrow line
            L.polyline([[lat, lon], [endLat, endLon]], {
              color: color,
              weight: 2,
              opacity: 0.9
            }).addTo(arrowLayerGroup);

            // Arrowhead
            const angle = (Math.atan2(u, v) * 180 / Math.PI);
            // const angle = feature.properties.wind_direction - 180; 
            const arrowIcon = L.divIcon({
              className: 'arrow-icon',
              iconSize: [10, 10],
              html: `<div style="
                transform: rotate(${angle}deg);
                width: 0;
                height: 0;
                border-left: 6px solid transparent;
                border-right: 6px solid transparent;
                border-bottom: 12px solid ${color};
                opacity: 0.8;
              "></div>`
            });

            L.marker([endLat, endLon], { icon: arrowIcon }).addTo(arrowLayerGroup);
          });
        });
    
        // Load the path from the GeoJSON file
        fetch(path_file)
            .then(response => response.json())
            .then(data => {
            const path = L.geoJSON(data, {
                style: {
                color: '#0000FF', // blue for the path
                weight: 2,
                opacity: 0.8
                }
            }).addTo(map);
            });

    // add the great circle path
    fetch(great_circle_path)
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data, {
          style: {
            color: '#FF0000', // red for the great circle path
            weight: 2,
            opacity: 0.8
          }
        }).addTo(map);
      });

      // // add great circle wind arrows
      // fetch(great_circle_wind_file)
      //   .then(response => response.json())
      //   .then(data => {
      //     const scale = 0.2;
      //     data.features.forEach(feature => {
      //       const [lon, lat] = feature.geometry.coordinates;
      //       const u = feature.properties.u_component;
      //       const v = feature.properties.v_component;
      //       const speed = Math.sqrt(u * u + v * v);
      //       const color = getColor(speed);
      //       const endLat = lat - v * scale;
      //       const endLon = lon - u * scale;

      //       // Wind arrow line
      //       L.polyline([[lat, lon], [endLat, endLon]], {
      //         color: color,
      //         weight: 2,
      //         opacity: 0.9
      //       }).addTo(arrowLayerGroup);
      //       // Arrowhead
      //       const angle = (Math.atan2(v, u) * 180 / Math.PI) -180;

      //       const arrowIcon = L.divIcon({
      //         className: 'arrow-icon',
      //         iconSize: [10, 10],
      //         html: `<div style="
      //           transform: rotate(${90 - angle}deg);
      //           width: 0;
      //           height: 0;
      //           border-left: 6px solid transparent;
      //           border-right: 6px solid transparent;
      //           border-bottom: 12px solid ${color};
      //           opacity: 0.8;
      //         "></div>`
      //       });
      //       L.marker([endLat, endLon], { icon: arrowIcon }).addTo(arrowLayerGroup);
      //     });
      //   });



    // Legend
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'info legend');
      const speeds = [0, 2, 5, 10, 15];
      div.innerHTML += '<b>Wind Speed (m/s)</b><br>';
      for (let i = 0; i < speeds.length; i++) {
        const from = speeds[i];
        const to = speeds[i + 1];
        div.innerHTML +=
          `<i style="background:${getColor(from + 0.1)}"></i> ${from}${to ? '&ndash;' + to : '+'}<br>`;
      }
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
